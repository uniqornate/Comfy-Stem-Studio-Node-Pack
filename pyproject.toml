[project]
name = "stem-studio"
description = "Separate dialogue, music and effects from video or audio, pull single sounds out with USS, SAM Audio and GuideSep, mix and export, with the full Stem Studio UI inside ComfyUI. Open weights only."
version = "0.13.25"
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["psutil"]

[project.urls]
Repository = "https://github.com/uniqornate/Comfy-Stem-Studio"

[tool.comfy]
# PublisherId must be your Comfy Registry publisher id before the first publish (registry.comfy.org). Left empty on purpose.
PublisherId = ""
DisplayName = "Stem Studio"
Icon = ""
includes = ["comfy_nodes/StemStudio/app", "comfy_nodes/StemStudio/web"]
